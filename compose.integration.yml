services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support_ticket
      POSTGRES_USER: support_ticket
      POSTGRES_PASSWORD: support_ticket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_ticket -d support_ticket"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://support_ticket:support_ticket@db:5432/support_ticket
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://support_ticket:support_ticket@db:5432/support_ticket
      NODE_ENV: production
    ports:
      - "127.0.0.1::3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
